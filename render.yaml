services:
  # Backend Web Service
  - type: web
    name: ticketai-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: ticketai-postgres
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: SUPPORT_EMAIL
        value: onboarding@resend.dev
      - key: IMAP_ENABLED
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@ticketai.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: "System Administrator"

databases:
  # Managed PostgreSQL Database
  - name: ticketai-postgres
    databaseName: helpdesk
    user: ticketadmin
    plan: free
    region: singapore
